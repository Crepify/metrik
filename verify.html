<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12345b"><title>metrik — Public Certificate Check</title>
<style>
:root{--navy:#12345b;--teal:#159a83;--muted:#60758e;--line:#d6e1ed}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#edf5fb,#f8fbfd);font-family:Inter,Arial,sans-serif;color:#1f405e}.wrap{max-width:680px;margin:auto;padding:28px 18px}.brand{display:flex;gap:10px;align-items:center;font-weight:800;color:#fff;background:linear-gradient(125deg,#12345b,#256384);padding:13px 15px;border-radius:16px}.mark{height:33px;width:33px;border-radius:50%;background:#47d2b8;color:#113657;display:grid;place-items:center}.card{margin-top:20px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:23px;box-shadow:0 15px 35px rgba(22,59,94,.12)}h1{font-size:23px;letter-spacing:-.5px;margin:0 0 7px}p{color:var(--muted);line-height:1.5;font-size:13px}.status{margin:17px 0;padding:12px 13px;border-radius:10px;font-size:13px;font-weight:750}.status.valid{background:#e8faf4;color:#097961;border:1px solid #bfeedd}.status.invalid{background:#fff0f1;color:#bb4150;border:1px solid #ffd0d4}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.detail{border:1px solid var(--line);border-radius:9px;padding:10px;background:#fbfdff}.detail span{display:block;font-size:9px;color:#72849a;text-transform:uppercase;font-weight:800;letter-spacing:.6px}.detail b{display:block;margin-top:5px;font-size:12px;color:#213e5b}.note{margin-top:18px;font-size:10px;color:#718299;line-height:1.5}.back{display:inline-block;margin-top:15px;color:#2864c8;font-weight:800;font-size:12px;text-decoration:none}@media(max-width:480px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body><main class="wrap"><div class="brand"><div class="mark">✓</div><div>metrik <small style="display:block;font-size:9px;letter-spacing:1px;color:#c8e6f4">PUBLIC CERTIFICATE VERIFICATION</small></div></div><section class="card" id="card"><h1>Checking certificate…</h1><p>Reading the QR certificate payload.</p></section></main>
<script>
function decode(v){try{return JSON.parse(decodeURIComponent(escape(atob(v))))}catch{return null}}
const p=new URLSearchParams(location.search),cert=decode(p.get('c')||''),card=document.getElementById('card');
if(!cert){card.innerHTML='<h1>Certificate could not be verified</h1><div class="status invalid">Invalid or incomplete QR certificate payload.</div><p>Scan an issued metrik QR certificate or contact the Legal Metrology authority for verification.</p>';}
else{const safe=s=>String(s||'—').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));card.innerHTML=`<h1>Certificate verification result</h1><div class="status valid">VALID — QR certificate payload is readable</div><p>This read-only public view displays certificate information encoded in the QR certificate.</p><div class="grid"><div class="detail"><span>Certificate ID</span><b>${safe(cert.certificateId)}</b></div><div class="detail"><span>Status</span><b>${safe(cert.status)}</b></div><div class="detail"><span>Instrument type</span><b>${safe(cert.instrumentType)}</b></div><div class="detail"><span>Model / serial</span><b>${safe(cert.model)} / ${safe(cert.serial)}</b></div><div class="detail"><span>Instrument user</span><b>${safe(cert.owner)}</b></div><div class="detail"><span>Valid till</span><b>${safe(cert.validUntil)}</b></div></div><p class="note">Prototype note: production deployment must validate a server-signed certificate record against the central verification database before presenting a final authenticity result.</p><a class="back" href="./">← Return to metrik</a>`;}
</script></body></html>
